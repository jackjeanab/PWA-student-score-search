<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#063f50" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="../icon.svg" />
  <title>學生個人成績查詢系統</title>
  <style>
    :root{--bg:#eef7f2;--panel:#fff;--ink:#123944;--muted:#60737a;--brand:#087d79;--brand2:#063f50;--soft:#dff3ed;--danger:#b94747}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#f7f3e8,var(--bg));min-height:100vh}.shell{width:min(960px,calc(100% - 24px));margin:auto;padding:20px 0 36px}.hero{padding:12px 4px 20px}.eyebrow{margin:0 0 6px;color:var(--brand);font-weight:800;letter-spacing:.12em;font-size:.78rem}.hero h1{margin:0;font-size:clamp(1.8rem,6vw,3rem)}.hero p{margin:10px 0 0;color:var(--muted)}.panel{padding:22px;border:1px solid #fff;border-radius:24px;background:rgba(255,255,255,.9);box-shadow:0 16px 38px #12394416}.field{display:grid;gap:7px;margin-bottom:14px;font-weight:700}.field input,.field select{width:100%;padding:13px 14px;border:1px solid #cbd9d4;border-radius:12px;font:inherit;background:#fff}.button{border:0;border-radius:999px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer}.primary{color:#fff;background:var(--brand)}.secondary{color:var(--brand2);background:var(--soft)}.danger{color:#fff;background:var(--danger)}.toolbar,.tabs,.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.toolbar{justify-content:space-between;margin-bottom:18px}.meta{color:var(--muted);line-height:1.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}.subject{padding:13px 10px;border:1px solid #c7ded7;border-radius:14px;background:#f6fbf8;font-weight:800}.subject.active{color:#fff;background:var(--brand)}.score{display:flex;justify-content:space-between;padding:13px 14px;border-radius:12px;background:#f6faf8;margin-top:8px}.badge{padding:10px 14px;border-radius:999px;color:var(--brand2);background:var(--soft);font-weight:800}.message{min-height:24px;margin:12px 0;color:var(--danger)}.hidden{display:none!important}.bridge{position:absolute;width:1px;height:1px;border:0;opacity:0;pointer-events:none}.table-wrap{overflow:auto}.records{width:100%;border-collapse:collapse}.records th,.records td{text-align:left;padding:10px 8px;border-bottom:1px solid #dbe7e2;white-space:nowrap}.empty{padding:18px;color:var(--muted);border:1px dashed #cbd9d4;border-radius:12px}.notice{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff4e6;color:#7a5420}@media(max-width:600px){.panel{padding:18px}.toolbar{align-items:stretch}.toolbar .button{width:100%}.records th,.records td{white-space:normal}}
  </style>
</head>
<body>
  <iframe id="gasBridge" class="bridge" title="後端連線"></iframe>
  <div class="shell">
    <header class="hero"><p class="eyebrow">STUDENT SCORE SEARCH</p><h1>學生個人成績查詢系統</h1><p>使用手機快速查詢成績與登入紀錄。</p></header>
    <main>
      <section id="loginPanel" class="panel"><h2>登入</h2><p class="meta">請輸入學生或教師帳號，系統會自動判斷身份。</p><form id="loginForm"><label class="field">帳號<input id="account" autocomplete="username" required /></label><label class="field">密碼<input id="password" type="password" autocomplete="current-password" required /></label><button class="button primary" type="submit">登入</button></form><p id="loginMessage" class="message" role="alert"></p></section>
      <section id="studentPanel" class="panel hidden"><div class="toolbar"><div><p class="eyebrow">學生查詢</p><h2 id="studentName">-</h2><p id="studentMeta" class="meta"></p></div><button id="studentLogout" class="button secondary">登出</button></div><div class="tabs"><button id="regularTab" class="button secondary">段考範圍</button><button id="mockTab" class="button secondary">模擬考範圍</button></div><div id="subjects" class="grid"></div><div class="toolbar"><h3 id="scoreTitle">請選擇科目</h3><span id="average" class="badge">平均：-</span></div><div id="scores"></div><p id="studentMessage" class="message"></p></section>
      <section id="teacherPanel" class="panel hidden"><div class="toolbar"><div><p class="eyebrow">教師管理</p><h2 id="teacherName">-</h2><p id="teacherMeta" class="meta"></p></div><button id="teacherLogout" class="button secondary">登出</button></div><div class="toolbar"><select id="queryMode" class="field" style="margin:0;min-width:180px"><option value="all">全部登入紀錄</option><option value="single">單一學生</option></select><select id="studentSelect" class="field hidden" style="margin:0;min-width:220px"></select><button id="queryButton" class="button primary">查詢</button></div><div id="logTable" class="table-wrap"></div><p id="teacherMessage" class="message"></p><div id="syncBox" class="notice hidden"><strong>管理者功能</strong><p>同步前會先預覽影響範圍，可能移除已不存在學生的成績。</p><button id="previewSync" class="button danger">預覽同步學生資料</button></div></section>
    </main>
  </div>
  <script>
    const GAS_URL='https://script.google.com/a/macros/hlc.edu.tw/s/AKfycbyDmhlDpI57YboIm7Hgu2Mkhhhr6r45hmDKvatzxBNG2BgC-lAM_J9RbuMCZD6r723M/exec?api=bridge';
    const state={role:'',student:null,teacher:null,studentToken:'',teacherToken:'',scope:'regular',subjects:[],mockSubjects:[],activeSubject:null,requestId:0,pending:{},studentOptions:[]};
    const $=id=>document.getElementById(id); const bridge=$('gasBridge'); bridge.src=GAS_URL;
    window.addEventListener('message',event=>{const d=event.data;if(!d||d.type!=='student-score-response'||!state.pending[d.requestId])return;const p=state.pending[d.requestId];delete state.pending[d.requestId];d.ok?p.resolve(d.result):p.reject(new Error(d.error||'連線失敗'));});
    function call(method,...args){return new Promise((resolve,reject)=>{const requestId=String(++state.requestId);state.pending[requestId]={resolve,reject};const send=()=>bridge.contentWindow.postMessage({type:'student-score-request',requestId,method,args},'*');if(bridge.contentWindow)send();else setTimeout(send,300);setTimeout(()=>{if(state.pending[requestId]){delete state.pending[requestId];reject(new Error('連線逾時，請重新整理後再試。'));}},20000);});}
    function show(name){$('loginPanel').classList.toggle('hidden',name!=='login');$('studentPanel').classList.toggle('hidden',name!=='student');$('teacherPanel').classList.toggle('hidden',name!=='teacher');}
    function msg(id,text){$(id).textContent=text||''} function err(e){return e?.message||String(e)}
    $('loginForm').addEventListener('submit',async e=>{e.preventDefault();msg('loginMessage','登入中……');try{const r=await call('unifiedLogin',$('account').value,$('password').value);state.role=r.role;if(r.role==='student'){state.studentToken=r.token;state.student=r.student;state.subjects=r.subjects||[];state.mockSubjects=r.mockSubjects||[];$('studentName').textContent=r.student.name||'-';$('studentMeta').textContent=[r.student.studentId,r.student.className,r.student.seatNo].filter(Boolean).join('　');renderSubjects();show('student');}else{state.teacherToken=r.token;state.teacher=r.teacher;$('teacherName').textContent=r.teacher.name||'-';$('teacherMeta').textContent=r.teacher.teacherId+'　角色：'+(r.teacher.role||'admin');$('syncBox').classList.toggle('hidden',(r.teacher.role||'admin').toLowerCase()!=='admin');await loadOptions();show('teacher');}msg('loginMessage','');}catch(e){msg('loginMessage',err(e));}});
    function renderSubjects(){const list=state.scope==='mock'?state.mockSubjects:state.subjects;$('subjects').innerHTML='';list.forEach(s=>{const b=document.createElement('button');b.className='subject'+(state.activeSubject===s.id?' active':'');b.textContent=s.name;b.onclick=()=>loadScore(s.id,s.name);$('subjects').appendChild(b);});}
    $('regularTab').onclick=()=>{state.scope='regular';state.activeSubject=null;renderSubjects();clearScore();};$('mockTab').onclick=()=>{state.scope='mock';state.activeSubject=null;renderSubjects();clearScore();};
    async function loadScore(id,name){state.activeSubject=id;renderSubjects();$('scoreTitle').textContent=name;$('scores').innerHTML='<div class="empty">讀取中……</div>';try{const r=await call('getStudentScoresBySubject',state.studentToken,id,state.scope);$('average').textContent='平均：'+(r.average==null?'-':Number(r.average).toFixed(2));$('scores').innerHTML=r.scores?.length?r.scores.map(x=>'<div class="score"><strong>'+escapeHtml(x.label)+'</strong><span>'+escapeHtml(x.score===''?'-':x.score)+'</span></div>').join(''):'<div class="empty">目前沒有成績資料。</div>';}catch(e){msg('studentMessage',err(e));}}
    function clearScore(){$('scoreTitle').textContent='請選擇科目';$('scores').innerHTML='<div class="empty">請選擇科目。</div>';$('average').textContent='平均：-';}
    $('studentLogout').onclick=async()=>{try{await call('logout',state.studentToken);}finally{state.studentToken='';show('login');}};$('teacherLogout').onclick=async()=>{try{await call('teacherLogout',state.teacherToken);}finally{state.teacherToken='';show('login');}};
    async function loadOptions(){state.studentOptions=await call('getTeacherStudentOptions',state.teacherToken);$('studentSelect').innerHTML='<option value="">請選擇學生</option>'+state.studentOptions.map(x=>'<option value="'+escapeHtml(x.studentId)+'">'+escapeHtml(x.studentId+' - '+(x.name||''))+'</option>').join('');}
    $('queryMode').onchange=()=>{$('studentSelect').classList.toggle('hidden',$('queryMode').value!=='single');};$('queryButton').onclick=()=>loadLogs(1);
    async function loadLogs(page){try{const single=$('queryMode').value==='single';if(single&&!$('studentSelect').value){msg('teacherMessage','請先選擇學生。');return;}const r=single?await call('getLoginLogsByStudent',state.teacherToken,$('studentSelect').value,page,50):await call('getLoginLogs',state.teacherToken,page,50);$('logTable').innerHTML=r.records?.length?'<table class="records"><thead><tr><th>學號</th><th>姓名</th><th>登入時間</th><th>狀態</th></tr></thead><tbody>'+r.records.map(x=>'<tr><td>'+escapeHtml(x.studentId)+'</td><td>'+escapeHtml(x.name||'-')+'</td><td>'+escapeHtml(x.loginTime)+'</td><td>'+escapeHtml(x.status)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">查無登入紀錄。</div>';}catch(e){msg('teacherMessage',err(e));}}
    $('previewSync').onclick=async()=>{try{const r=await call('previewStudentSync',state.teacherToken);if(confirm('將處理 '+r.sheetCount+' 張工作表；新增 '+r.added+' 列、刪除 '+r.removed+' 列。確定同步？')){const done=await call('syncStudentsToSubjectSheets',state.teacherToken);alert('同步完成：新增 '+done.added+' 列、刪除 '+done.removed+' 列。');await loadOptions();}}catch(e){msg('teacherMessage',err(e));}};
    function escapeHtml(t){return String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    show('login');
  </script>
</body>
</html>
